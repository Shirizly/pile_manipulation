# Resolved config for MODEL-0009 (switched-linear visual foresight on FleX image masks, DS-0020 v2, EXP-0062 RUN-0002)
id: MODEL-0009
kind: linear-foresight-switched     # + single (unswitched) operator in the same bundle
payload: checkpoint.pt              # Baselines/LinearForesight/predictor.py bundle format
fit_script: experiments/EXP-0062-flex-v2-train-rerun/code/fit_lf_v2.py   # final per-bin ops via Baselines/LinearForesight/fit_switched.py::fit_bins
train_data: {instance: datasets/DS-0020-training-data-flex-N864/config.yaml, version: 2, split: train, occ_source: image_mask, exclude_flagged: true, rows: 15093, trajectories: 1669}
