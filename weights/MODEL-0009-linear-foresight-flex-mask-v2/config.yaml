ridge_switched: 300.0                # selected on val from [1,10,30,100,300,1000,3000,10000] x 2 bin schemes
ridge_single: 1000.0                 # selected on val, same grid
pixel_mapping: fit_linear_foresight.actions_to_pixels (same at fit and predict; 0.5 px FleX offset trap, CODEMAP)
alt_collection_bins: {payload: alt_collection_bins/checkpoint.pt, bin_edges: [0.9617, 2.4042, 3.8467, 5.2892, 6.7317, 8.1742, 9.6167], counts_train: [3712, 4057, 3940, 2630, 692, 62], ridge_switched: 300.0, note: "rows outside the edges go to the end bins (bin_index clamps); NOT selected"}
