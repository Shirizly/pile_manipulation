# Resolved training config for MODEL-0006 (copy of Baselines/NFD/runs/nfd_3ch_flex_mask_seed1/run_config.yaml).
# DATA = DS-0020 **v1** (the OLD payload, archived 2026-10-02 to datasets/DS-0020-*/old_data/_ported_v1/); instance paths repointed there. Not the current DS-0020 v2.
# Template: Baselines/NFD/configs/nfd_3ch_flex_mask.yaml (its header lists every deviation from
# nfd_train_3ch_randlen.yaml). Launch: --seed 1 --override training.shuffle_seed=1 output.log_dir=Baselines/NFD/runs/nfd_3ch_flex_mask_seed1
model:
  type: nfd-unet3ch
  in_channels: 3
  out_channels: 1
  features:
  - 4
  - 8
  - 16
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: None
  bottleneck_kwargs: {}
  uses_physics: false
dataset:
  type: flex
  instance: datasets/DS-0020-training-data-flex-N864/old_data/_ported_v1/config.yaml
  split_instances:
    test:
      instance: datasets/DS-0019-slates-flex-pile-varN/config.yaml
      split: all
  occ_source: image_mask
  channels: 3
  exclude_flagged: true
  include_physics: false
  transforms:
  - type: ensure_representation
    representation: eulerian
  - type: eulerian_aliases
training:
  epochs: 80
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 150
    gamma: 0.75
  augmentation: true
  patience: 150
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  save_full_state: true
  full_state_every_min: 10
  shuffle_seed: 1
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0
output:
  log_dir: Baselines/NFD/runs/nfd_3ch_flex_mask_seed1
_config_path: /home/alon/Code/pile_manipulation/Baselines/NFD/configs/nfd_3ch_flex_mask.yaml
