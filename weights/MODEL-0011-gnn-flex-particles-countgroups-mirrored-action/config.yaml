# Resolved model config (source repo config/train/gnn_dyn_grouped.yaml, dyn-res-pile-manip @ 5c9eca9). action_z_sign absent = +1 (as run, mirrored).
# Training config for train/train_gnn_dyn_grouped.py. Structurally mirrors
# config/train/gnn_dyn.yaml (the baseline); only the `train` section is read
# (see dataset/dataset_grouped_particles.py -- no camera/depth-image step,
# so this config carries no `dataset` section at all).

train:
  data_root: "data/true_action_transitions_carrots_grouped"
  random_seed: 42
  n_epoch: 300
  lr: 0.001
  adam_beta1: 0.9
  batch_size: 16
  num_workers: 4
  train_valid_ratio: 0.9  # applied WITHIN each object-count group, see dataset docstring
  log_per_iter: 20
  ckp_per_iter: 200
  n_history: 1
  n_rollout: 5
  particle:
    nf_effect: 64
    node_budget: 30  # fixed node cap; min(30, state's target object count) if lower
    resume:
      active: False
      epoch: 0
      iter: 0
      folder: 'None'
    adj_thresh: 0.08
    add_delta: False
