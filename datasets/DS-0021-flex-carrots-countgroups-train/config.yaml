# Resolved instance config (FlexData/dataset.py reads this; EXP-0064 RUN-0013, 2026-10-04).
# FlexData fields mirror DS-0020 v2's config.yaml (grid/plate/flags IDENTICAL, image-mask input).
# Source-repo collector config copied verbatim from EXP-0064 code/configs/ (source_config, below); see DATASET.md
template: configs/dataset/flex_pile_instance_v2.yaml (copied from datasets/DS-0020-*/config.yaml, fields unchanged except ids/paths)
id: DS-0021
version: 1
kind: trajectories
units: flex
cache_dir: datasets/DS-0021-flex-carrots-countgroups-train/cache
cache_format: traj_manifest_v2   # v2_chunk_*.npz (python -u -m FlexData.build_cache ds0021)
raw_dir: datasets/DS-0021-flex-carrots-countgroups-train/data
split_file: datasets/DS-0021-flex-carrots-countgroups-train/splits.json   # per-group 90/10 by state = EXP-0064 GNN split
action_frame: 'stored (x, -z): particle z = -action[1], -action[3] (flex-action-frame-neg-z)'
scene:                    # from data/run_config.json (same scene as DS-0019/DS-0020)
  global_scale: 24
  wkspc_w: 5.0
  action_margin: 1.6
  particle_r: 0.125
  cam_idx: 0
grid:
  half_extent: 7.2        # 64 px -> 0.225 units/px
  resolution: 64
  footprint_radius_px: 1.0
occupancy:
  source: image_mask      # colour-image mask route (python -u -m FlexData.image_mask ds0021)
  mask_file: null         # default <cache_dir>/image_masks.npz
plate:
  width: 2.4
  thickness: 0.225
  height: null
  sigma_px: 0.75
flags:
  null_disp: 0.1
  escape_abs: 10.0        # drops the escaped-particle rows the collector marks valid
  max_out_of_grid_frac: 0.01
source_config: |
  dataset:
    folder: "data/true_action_transitions_carrots_grouped" # manifest + per-state/step data
    init_pos: 'spread' # overridden per state to 'count_target' (see transitions.count_groups)
    global_scale: 24
    obj: "carrots"
    particle_r: 0.125
    cam_idx: 0
    wkspc_w: 5.0
    headless: True
    cont_motion: False
    robot_type: 'franka'
    franka_urdf: 'env/assets/franka_panda_plate/panda_plate.urdf'
    action_margin: 1.6
  
  # Sequential-rollout format (see collect_transitions.py), same as
  # transitions_carrots.yaml, EXCEPT initial-state sampling targets an exact
  # object-count range per state instead of rand_blob/rand_spread -- built for
  # testing how GNN accuracy/capture scales with object count (see
  # env/flex_env_multi.py's `count_target` init_pos branch for why
  # rand_blob/rand_spread can't hit these ranges directly: they produce only a
  # handful of discrete counts, none below ~45).
  #
  # 2000 states split into 4 equal contiguous blocks of 500 (state_idx // 500):
  #   block 0 (0-499):     10-30 objects
  #   block 1 (500-999):   50-70 objects
  #   block 2 (1000-1499): 100-150 objects
  #   block 3 (1500-1999): 400-500 objects
  # Per-state target count drawn uniformly within its block's range, seeded by
  # (seed, state_idx) -- see collect_transitions.py's resolve_count_group.
  transitions:
    n_states: 2000
    n_steps: 10
    seed: 0
    count_groups: [[10, 30], [50, 70], [100, 150], [400, 500]]
    action_sampler: 'obj_biased'
    max_retries: 20
    max_reset_attempts: 2
    bins:
      # Informational only (push_length / bin recorded per transition, no
      # per-step stratification) -- same edges as the other carrots datasets
      # for cross-dataset comparability.
      edges_abs: [0.9617, 2.4042, 3.8467, 5.2892, 6.7317, 8.1742, 9.6167]
  
  # n_envs is forced to 1 by collect_transitions.py regardless of this value.
  parallel:
    n_envs: 1
    tile_pitch_scale: 2
    tile_seed: 12345
    nan_check_every: 1
