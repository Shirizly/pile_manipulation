# Warped NFD pilot -- L20mm ONLY, WITH the wall (workspace-extent) channel.
#
# Identical to nfd_train_warped_L20mm_pilot.yaml in every recipe knob
# (dataset, resolution_scale, loss, lr, scheduler, augmentation, batch,
# epochs) -- the only differences are wall_channel: true and in_channels: 4
# (the model wrapper asserts this pairing; see
# Baselines/NFD/warped_nfd_lib.py::_build_warped_nfd_unet). Compared against
# nfd_train_warped_L20mm_pilot.yaml (no wall channel) and
# nfd_train_3ch_L20mm_pilot.yaml (unwarped control) -- see that file's header
# for the full three-arm comparison rationale and the plate_mode/epochs
# derivation (both copied unchanged here).
model:
  type: nfd-unet-warped
  in_channels: 4
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false
  plate_mode: canonical
  wall_channel: true
  resolution_scale: 0.5
  scale: 1.0

dataset:
  type: nfd-genesis-3ch-warped
  paths:
    - slates_multistep/n20_L20mm_train
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0198
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 20
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_warped_walls_L20mm_pilot

# NOTE (post-run refactor, pure code move, no behaviour/retrain change): the
# Baselines/NFD/warped_nfd_lib.py / residual_nfd_lib.py module paths named in
# the comments above moved to model/warped_nfd/lib.py / model/residual_nfd/lib.py
# after this run -- registered type names are unchanged. See docs/CODEMAP.md.
