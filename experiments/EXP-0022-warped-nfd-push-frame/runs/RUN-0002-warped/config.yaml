# Warped NFD pilot -- L20mm ONLY, no wall channel.
#
# This is a smoke/pilot config for the "warped NFD" model
# (Baselines/NFD/warped_nfd_lib.py): the same NFD UNet architecture as
# nfd_train_3ch.yaml, but predicting in the CANONICAL PUSH FRAME
# (transforms.functional.push_frame_roundtrip) instead of the world frame.
# It is compared against TWO other arms trained with this exact recipe:
#   - nfd_train_warped_walls_L20mm_pilot.yaml (same, + a 4th wall channel)
#   - nfd_train_3ch_L20mm_pilot.yaml           (unwarped control, plain
#     nfd-genesis-3ch + nfd-unet3ch -- needed because no existing NFD
#     checkpoint was trained on L20mm alone, so there is otherwise nothing
#     to compare this pilot against)
#
# Dataset restricted to slates_multistep/n20_L20mm_train ONLY (not the
# pooled L20+L40 set nfd_train_3ch.yaml uses), so all three arms train on
# the identical data. Every other recipe knob (resolution_scale 0.5,
# min_push_length_m 0.0198, val/test 5/5, features, loss, lr, scheduler,
# augmentation true, batch 32) is copied unchanged from nfd_train_3ch.yaml.
#
# plate_mode: canonical -- decided by the timing measurement in
# WARPED_NFD_NOTES.md ("plate_mode default" section): a full training step
# (forward+backward+optimizer, UNet + all preprocessing, batch 32 pre-
# augmentation / 256 post-augmentation, 64x64 grid) measured canonical vs
# warp interleaved on an idle GPU came out within a few percent of each
# other (canonical -3.6% vs warp in the most controlled, paired run; +7.2%
# and -11.2% in two separate-process runs) -- i.e. the two are
# indistinguishable at this measurement's noise floor, but EVERY
# measurement is comfortably under the user's 10% threshold, so canonical
# is used as the default (it is also the architecturally simpler path: no
# extra grid_sample warp of the plate channels).
#
# epochs: 20 -- a real 1-epoch timed run of this exact config (plate_mode
# canonical, L20mm_train, batch 32, augmentation on) measured 37.9s/epoch
# on an idle GPU, so 20 epochs ~= 12.6 minutes, under the ~15-minute budget
# for this smoke config with some margin.
model:
  type: nfd-unet-warped
  in_channels: 3
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false
  plate_mode: canonical
  wall_channel: false
  resolution_scale: 0.5   # must match dataset.resolution_scale below --
                          # used to compute plate geometry in world pixels
                          # for canonical_plate_channels (no `raw` dataset
                          # instance available inside the model wrapper).
  scale: 1.0

dataset:
  type: nfd-genesis-3ch-warped
  paths:
    - slates_multistep/n20_L20mm_train
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0198
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 20
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_warped_L20mm_pilot

# NOTE (post-run refactor, pure code move, no behaviour/retrain change): the
# Baselines/NFD/warped_nfd_lib.py / residual_nfd_lib.py module paths named in
# the comments above moved to model/warped_nfd/lib.py / model/residual_nfd/lib.py
# after this run -- registered type names are unchanged. See docs/CODEMAP.md.
