model:
  type: nfd-unet-warped
  in_channels: 3
  out_channels: 1
  features:
  - 4
  - 8
  - 16
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: None
  bottleneck_kwargs: {}
  uses_physics: false
  plate_mode: canonical
  wall_channel: false
  resolution_scale: 0.5
  scale: 1.0
dataset:
  type: nfd-genesis-3ch-warped
  paths:
  - slates_multistep/n20_L20mm_train
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0198
  transforms:
  - type: ensure_representation
    representation: eulerian
  - type: eulerian_aliases
training:
  epochs: 20
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0
output:
  log_dir: Baselines/NFD/runs/nfd_warped_L20mm_pilot
_config_path: /home/alon/Code/pile_manipulation/Baselines/NFD/configs/nfd_train_warped_L20mm_pilot.yaml
