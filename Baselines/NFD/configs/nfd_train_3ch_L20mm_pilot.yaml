# UNWARPED control for the warped-NFD pilot -- plain nfd-genesis-3ch +
# nfd-unet3ch (world-frame prediction, exactly nfd_train_3ch.yaml's recipe),
# restricted to slates_multistep/n20_L20mm_train ONLY.
#
# Needed because no existing NFD checkpoint was trained on L20mm alone
# (nfd_train_3ch.yaml trains on the pooled L20+L40 set), so there is
# otherwise nothing to compare nfd_train_warped_L20mm_pilot.yaml /
# nfd_train_warped_walls_L20mm_pilot.yaml against on identical data. Every
# recipe knob (resolution_scale 0.5, min_push_length_m 0.0198, val/test 5/5,
# features, loss, lr, scheduler, augmentation true, batch 32, epochs 20) is
# identical to the two warped pilot configs -- see
# nfd_train_warped_L20mm_pilot.yaml's header for the epochs/timing
# derivation (all three arms share it for a fair comparison).
model:
  type: nfd-unet3ch
  in_channels: 3
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false

dataset:
  type: nfd-genesis-3ch
  paths:
    - slates_multistep/n20_L20mm_train
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0198
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 20
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_3ch_L20mm_pilot
