# EXP-0059 clean-data re-collection (2026-09-28): same recipe/architecture as
# nfd_3ch_narrow_l20.yaml (EXP-0053), retrained on the FRESH ISS-010-fix-
# sampler corpus (`Genesis/data/narrow_l20_n20/train_v2`, ~12,032 chain rows,
# seed 2003) instead of DS-0008+DS-0010. Differences from nfd_3ch_narrow_l20.
# yaml, and ONLY these:
#   - dataset.paths: train_v2 only (replaces train + extra_18_22)
#   - dataset.exclude_flagged: true (drops gap_out_of_window/invalid/illegal/
#     null-transition rows at load time -- see Genesis/training/dataset.py::
#     PileSweepData's own docstring; illegal should already be ~0 by
#     construction under the ISS-010-fix sampler, verified 0/256 in the
#     pre-launch smoke test, results/clean_data_status.md)
#   - output.log_dir: nfd_3ch_narrow_l20_v2 (never overwrite the v1 registered
#     checkpoint/run)
# Model block, loss, epochs (60), batch size, lr, schedule: BYTE-IDENTICAL to
# nfd_3ch_narrow_l20.yaml, so any performance delta is attributable to the
# data, not the recipe.
model:
  type: nfd-unet3ch
  in_channels: 3
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false

dataset:
  type: nfd-genesis-3ch
  paths:
    - narrow_l20_n20/train_v2
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0001
  exclude_flagged: true
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 60
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 60
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_3ch_narrow_l20_v2
