# EXP-0063 pilot arm A (soft occupancy): nfd_3ch_narrow_l20_v2.yaml with ONE change --
# an occupancy_blur transform (Gaussian, sigma in 64x64 px; 1 px = 2 mm) on the
# input occupancy channel AND the target. Eval reads the sigma back from this
# run's run_config.yaml (Baselines/NFD/predictor.py::input_blur_sigma_from_run).
model:
  type: nfd-unet3ch
  in_channels: 3
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false

dataset:
  type: nfd-genesis-3ch
  paths:
    - narrow_l20_n20/train_v2
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0001
  exclude_flagged: true
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases
    - type: occupancy_blur
      sigma: 2.0

training:
  epochs: 60
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 60
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_3ch_narrow_l20_v2_soft_s2
