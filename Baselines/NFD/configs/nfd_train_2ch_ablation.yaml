# NFD ablation: repo's OWN 2-channel unioned action encoding (occ0 +
# 1-(1-occ1)*(1-occ2) union of the two draw_plate_soft renders at
# intensity 0.5/1.0), everything else identical to nfd_train_3ch.yaml
# (features, final_kernel_size, bottleneck_type, residual, plain MSE loss,
# same pooled dataset/paths). Isolates what the 3-channel split (vs the
# existing repo union) is worth, holding architecture/recipe/loss fixed.
#
# Uses the EXISTING "genesis" dataset type (registry/dataset_registry.py,
# unmodified) instead of this baseline's "nfd-genesis-3ch" -- only the
# dataset `type` and model `in_channels` differ from nfd_train_3ch.yaml.
model:
  type: nfd-unet3ch
  in_channels: 2
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false

dataset:
  type: genesis
  paths:
    - slates_multistep/n20_L20mm_train
    - slates_multistep/n20_L40mm_train
  # See nfd_train_3ch.yaml's comment: val_pct/test_pct=0 crashes
  # Trainer.from_config (it always builds a val/test split, unlike
  # Baselines/common/data.py). Small non-zero split used here for the same
  # reason, kept identical to the primary run so the ablation isolates only
  # the channel encoding.
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0198
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 100
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_2ch_ablation
