# EXP-0022 R1 -- UNWARPED residual control. Compared directly against
# RUN-0001 (nfd_train_3ch_L20mm_pilot.yaml, the plain unwarped NFD baseline)
# and RUN-0002 (nfd_train_warped_L20mm_pilot.yaml, warped/direct).
#
# Model: nfd-unet-family UNet via the NEW `nfd-unet-residual`-style wrapper
# `model/residual_nfd/lib.py::ResidualUnwarpedWrapper` (model type
# `nfd-unet3ch-residual`). Same architecture/channels/features as
# nfd-unet3ch, but `residual: false` (turns OFF UNetModels_modular.UNet's
# own occ0-into-logit skip) and an EXPLICIT external residual: the conv
# head's raw output goes through `tanh` (signed, bounded [-1,1] -- a sigmoid
# head cannot express a negative delta), added to occ0, clamped to [0,1],
# then converted back to a logit so the loss is UNCHANGED
# (`eulerian_combined`, mse=1.0 only) -- the loss stays world-frame MSE
# against the absolute occ1 target, exactly as every other pilot arm. This
# is a PARAMETERISATION change, not an objective change.
#
# Dataset: the EXISTING nfd-genesis-3ch dataset, UNCHANGED -- target stays
# occ1, no residual-target dataset variant. Every other recipe knob
# (resolution_scale 0.5, min_push_length_m 0.0198, val/test 5/5, features,
# lr, scheduler, augmentation true, batch 32, 20 epochs) is copied verbatim
# from nfd_train_3ch_L20mm_pilot.yaml so all arms are directly comparable.
#
# Expected result: little gain over RUN-0001, because RUN-0001 already has
# an occ0-into-logit skip (`residual: true` there) -- an identity path
# already exists in the control this arm is nominally replacing. This arm
# exists to be the control that makes R2 (the warped residual,
# nfd_train_residual_warped_L20mm_pilot.yaml) interpretable.
model:
  type: nfd-unet3ch-residual
  in_channels: 3
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: false   # REQUIRED false -- see module docstring; asserted, not silently coerced
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false

dataset:
  type: nfd-genesis-3ch
  paths:
    - slates_multistep/n20_L20mm_train
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0198
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 20
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_residual_unwarped_L20mm_pilot
