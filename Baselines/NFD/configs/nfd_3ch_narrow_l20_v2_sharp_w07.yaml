# EXP-0063 pilot arm B (condensed output): nfd_3ch_narrow_l20_v2.yaml with ONE change --
# loss.sharpness (mean p(1-p) of the sigmoid output). Per pixel, MSE + w*p(1-p) with
# hit-rate q has optimum p* = (2q - w) / (2(1 - w)) for w < 1: a contrast stretch
# about 0.5 (w -> 1 is a hard threshold), unlike MSE alone (p* = q).
model:
  type: nfd-unet3ch
  in_channels: 3
  out_channels: 1
  features: [4, 8, 16]
  kernel_size: 3
  final_kernel_size: 1
  activation: relu
  residual: true
  bottleneck_type: "None"
  bottleneck_kwargs: {}
  uses_physics: false

dataset:
  type: nfd-genesis-3ch
  paths:
    - narrow_l20_n20/train_v2
  val_pct: 5
  test_pct: 5
  resolution_scale: 0.5
  include_physics: false
  min_push_length_m: 0.0001
  exclude_flagged: true
  transforms:
    - type: ensure_representation
      representation: eulerian
    - type: eulerian_aliases

training:
  epochs: 60
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 60
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.0
    dice: 0.0
    bce: 0.0
    sharpness: 0.7
    tv: 0.0
    add: 0.0
    remove: 0.0

output:
  log_dir: Baselines/NFD/runs/nfd_3ch_narrow_l20_v2_sharp_w07
