# EXP-B multistep: UNetFilm trained on Genesis/data/slates_multistep/n20_L40mm_train
# (30 of 50 slates, all 3 steps, 11520 transitions). Architecture/epochs/
# optimiser/loss copied VERBATIM from EXP-0024's
# configs/training/exp0024_unetfilm_cube_spectrum_n20.yaml -- only the
# dataset block changed (paths -> slates_multistep/n20_L40mm_train,
# min_push_length_m -> this cell's own push length, not copied from the
# 20mm config).
model:
  type: unetfilm
  in_channels: 2
  cond_dim: 3
  uses_physics: true
  input_mode: standard
  residual_channel: 0
dataset:
  type: genesis
  paths:
  - slates_multistep/n20_L40mm_train
  val_pct: 10
  test_pct: 10
  resolution_scale: 0.5
  include_physics: true
  transforms:
  - type: ensure_representation
    representation: eulerian
  - type: eulerian_aliases
  physics:
    normalization:
      friction:
        min: 0.05
        max: 0.5
      density:
        min: 750.0
        max: 5000.0
      box_friction:
        min: 0.05
        max: 0.5
  min_push_length_m: 0.0396
training:
  epochs: 100
  batch_size: 32
  lr: 0.0001
  lr_scheduler:
    type: StepLR
    step_size: 50
    gamma: 0.75
  augmentation: true
  patience: 100
  mixed_precision: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 10
  num_workers: 4
  loss:
    type: eulerian_combined
    mse: 1.0
    mass: 0.2
    dice: 0.0
    bce: 0.0
    sharpness: 0.0
    tv: 0.0
    add: 0.0
    remove: 0.0
inference:
  representation: eulerian
  grid_n: 128
  plate_length_m: 0.04
  plate_width_m: 0.002
  plate_sigma_px: 1.5
  wkspc_w: 0.064
  global_scale: 0.6
  particle_friction: 0.25
  particle_density: 750.0
  box_friction: 0.3
output:
  log_dir: runs_expB/unetfilm_slates_multistep_n20_L40mm
