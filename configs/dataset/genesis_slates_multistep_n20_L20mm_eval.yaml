# Held-out EVAL split for n20_L20mm (20 of 50 slates, all 3 steps -- 60
# batches, 7680 transitions). Symlinked by
# scripts/probes/prepare_slate_multistep_split.py; disjoint from the *_train
# cell at the SLATE level (no slate appears in both).
#
# Used for TWO purposes by scripts/probes/expB_multistep_eval.py:
#   (a) image accuracy over ALL 3 steps (swept-region mask), and
#   (b) control ranking restricted to STEP 0 ONLY, filtered downstream by
#       the eval script using the source cell's manifest.json (batch_idx ->
#       slate_idx/step_idx) -- at step 0 every env of a slate shares an
#       identical start state, by construction of the data-collection
#       script; steps 1-2 are each env's own diverged rollout and are NOT
#       slates, so ranking candidate pushes against each other is only
#       meaningful at step 0.
#
# val_pct=0/test_pct=0/split="train" loads every file in the folder --
# these slates are held out by construction (a disjoint slate set from
# *_train), so the nominal split name is immaterial.
#
# NOTE (2026-09-10, applies to every model consuming this config):
# `states`/`states_` are PRIVILEGED ground-truth 3D cube pose -- a real
# top-down-camera deployment only ever has the occupancy raster
# (`occ0`/`occ1`). Do not feed `states`/`states_` directly into any model's
# input path; use `occ0` + foreground-extraction/FPS
# (`Baselines/GNN/perception.py`) to build camera-realistic node-level
# input instead, and reserve `states`/`states_` for training-time labels
# only. See `Baselines/GNN/SPEC.md`'s "CORRECTION" section (an earlier
# version of the GNN baseline fed these directly to the model -- that was a
# mistake, not a deliberate simplification).
type: genesis

paths:
  - slates_multistep/n20_L20mm_eval

val_pct: 0
test_pct: 0

resolution_scale: 0.5

min_push_length_m: 0.0198

include_physics: true

transforms:
  - type: ensure_representation
    representation: eulerian
  - type: eulerian_aliases

physics:
  normalization:
    friction: {min: 0.05, max: 0.50}
    density: {min: 750.0, max: 5000.0}
    box_friction: {min: 0.05, max: 0.50}
