# EXP-0030: held-out FILE-level test split of the overnight_randlen corpus,
# n20 groups only (mixed/piled/scattered at n_particles=20 -- Baselines/
# common/data.py::load_cell hard-assumes states shape (n,20,7), so n50 files
# cannot go through this config; they are covered separately by each
# baseline's own internal val/test monitoring split, which IS n-agnostic).
# Files are disjoint from *_train (scripts/probes/prepare_randlen_split.py,
# seed=0, exact indices in Genesis/data/overnight_randlen_test/split_manifest.json).
#
# NEW config -- does not touch any config used by prior runs.
# val_pct/test_pct=0/split="train" loads every file in `paths` (same pattern
# as the *_eval configs for slates_multistep): these files are already
# held out by construction.
type: genesis

paths:
  - overnight_randlen_test/mixed_n20
  - overnight_randlen_test/piled_n20
  - overnight_randlen_test/scattered_n20

val_pct: 0
test_pct: 0

resolution_scale: 0.5

min_push_length_m: 0.0001

include_physics: false
